name: Pull nginx and Push to GAR

on:
  workflow_dispatch:  # chạy thủ công hoặc bạn có thể dùng "push"

jobs:
  pull-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: hochanhti
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Pull nginx image from Docker Hub
        run: |
          docker pull nginx:latest

      - name: Retag nginx image for Artifact Registry
        run: |
          docker tag nginx:latest us-central1-docker.pkg.dev/hochanhti/my-repo/nginx:latest

      - name: Push image to Google Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/hochanhti/my-repo/nginx:latest
